; ESP32-C3 Super Mini + 1.28" round GC9A01 (240x240), server-driven.
; NOT a copy of ESP32-Plane-Radar's: no TLS, renamed partition table.
[platformio]
default_envs = c3

[env:c3]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/display_client.csv
board_build.embed_files = data/ui_font.vlw
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS
; The framework ships -Wno-format and project flags are emitted first, so a bare
; -Wformat would be overridden. Unflag it, then scope the errors to our sources:
; build_src_flags does not reach the libraries, which have their own noise.
build_unflags = -Wno-format
build_src_flags = -Wformat -Werror=format -Wall -Wextra
; main.cpp and main_spike.cpp each define setup()/loop(), so every env compiles
; exactly one. Without this the production build fails to LINK while the spike
; env builds fine -- and the spike is the one you happen to be running.
build_src_filter = +<*> -<main_spike.cpp>
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; Same firmware with verbose logging compiled in. Not a separate code path --
; identical sources, one -D. The guard name is PLANE_RADAR_DEBUG because that is
; what the copied debug_log.h tests; renaming one without the other compiles
; every DEBUG_LOG out while still looking enabled.
[env:c3-debug]
extends = env:c3
build_flags =
  ${env:c3.build_flags}
  -DPLANE_RADAR_DEBUG=1

[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  -I test/mocks
  -I test
  -I include
  -DUNIT_TEST
  ; Turns a static-buffer overrun into a clean abort naming the line instead of
  ; undefined behaviour that may or may not show as a failure. Host-only.
  -fsanitize=address,undefined
  -fno-omit-frame-pointer
  -DUNITY_INCLUDE_DOUBLE
  -DUNITY_DOUBLE_PRECISION=1e-9
build_type = debug
lib_deps =
  bblanchon/ArduinoJson@^7.4.2

; Headless bring-up spike: no display code, no renderer. Proves the heap, the
; on-target parse, the socket recovery and the real-LAN registration before ~800
; lines of ported rendering are built on top of them. src_dir is swapped so the
; production main.cpp is not compiled in.
[env:c3-spike]
extends = env:c3
build_src_filter = +<*> -<main.cpp>
build_flags =
  ${env:c3.build_flags}
  -DPLANE_RADAR_DEBUG=1
  -DHS_SPIKE_SERVER=\"192.168.1.116:8080\"
